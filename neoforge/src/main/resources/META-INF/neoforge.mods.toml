modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/BackupBackupFede/${mod_repo}/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "icon.png"
authors = "${mod_author}"
credits = "Support: https://ko-fi.com/acesoverdeuces777"
displayURL = "https://github.com/BackupBackupFede/${mod_repo}"
description = '''
Hostile mobs rarely drop a Potion of XP Boost. Drinking it multiplies by five every point of experience you gain - mobs, ores, furnaces, fishing, breeding. Rarer bottles last longer or hit harder. When it runs out, you go looking for another.

Support: https://ko-fi.com/acesoverdeuces777
'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_dep}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${neo_mc_dep}"
ordering = "NONE"
side = "BOTH"
